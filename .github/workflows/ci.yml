name: CI - Java Maven con JaCoCo y SonarCloud

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build, Test y Análisis
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para SonarCloud (análisis de historial completo)

      # 2. Configurar Java 17
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Caché de dependencias Maven (acelera las ejecuciones siguientes)
      - name: Caché de dependencias Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Compilar el proyecto
      - name: Compilar con Maven
        run: mvn clean compile --no-transfer-progress

      # 5. Ejecutar pruebas unitarias y generar reporte JaCoCo
      - name: Ejecutar pruebas y generar reporte JaCoCo
        run: mvn verify --no-transfer-progress

      # 6. Publicar resultados de pruebas en GitHub
      - name: Publicar resultados de pruebas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

      # 7. Publicar reporte JaCoCo como artefacto
      - name: Publicar reporte JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # 8. Análisis con SonarCloud
      - name: Análisis SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # Para decorar Pull Requests
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}     # Token secreto de SonarCloud
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=TU_PROJECT_KEY \
            -Dsonar.organization=TU_ORG_EN_SONARCLOUD \
            -Dsonar.host.url=https://sonarcloud.io \
            --no-transfer-progress
